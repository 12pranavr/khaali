<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>khaali · drive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* A driver reads this at a junction with the engine running. Big numbers,
     one thumb, and never a wall of text. */
  *{box-sizing:border-box}
  body{margin:0;background:#0d0f13;color:#e8e9ee;font-family:Manrope,system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent}
  .wrap{max-width:560px;margin:0 auto;padding:18px 18px 40px}
  .brand{font:800 18px/1 Manrope,sans-serif;letter-spacing:-.02em}
  .brand span{color:#d8385a}
  .brand small{display:block;font:600 9.5px/1.6 'IBM Plex Mono',monospace;letter-spacing:.14em;
    text-transform:uppercase;color:#7c828f;margin-top:4px}
  .state{margin-top:18px;border-radius:16px;padding:22px;text-align:center;
    border:1px solid #222836;background:#151922}
  .state.good{background:#0f2b1b;border-color:#1f5a38}
  .state.bad{background:#2c1219;border-color:#5a1f2e}
  .state.off{background:#2a2413;border-color:#5a4a1f}
  .word{font:800 30px/1.05 Manrope,sans-serif;letter-spacing:-.02em}
  .good .word{color:#5bd48b}.bad .word{color:#f2a6b6}.off .word{color:#e0a419}
  .sub{font:600 13.5px/1.5 Manrope,sans-serif;color:#b9bfcc;margin-top:8px}
  .card{background:#151922;border:1px solid #222836;border-radius:12px;padding:16px;margin-top:12px}
  .card.live{border-color:#5a1f2e;background:#191219}
  .card.mine{border-color:#1f5a38;background:#101a15}
  .lbl{font:700 9.5px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;
    color:#7c828f;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px}
  .row{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-top:1px solid #1c202a}
  .row:first-of-type{border-top:none}
  .k{flex:none;width:98px;font:600 12px/1.5 Manrope,sans-serif;color:#7c828f}
  .v{flex:1;font:600 13.5px/1.5 Manrope,sans-serif}
  .mono{font-family:'IBM Plex Mono',monospace}
  .spot{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid #1c202a}
  .spot:first-of-type{border-top:none}
  .dot{width:9px;height:9px;border-radius:99px;flex:none}
  .spot .who{flex:1;min-width:0}
  .spot .place{font:700 14.5px/1.3 Manrope,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .spot .when{font:600 11px/1.5 'IBM Plex Mono',monospace;color:#7c828f;letter-spacing:.06em;margin-top:2px}
  .spot .num{flex:none;text-align:right}
  .spot .big{font:800 21px/1 Manrope,sans-serif;letter-spacing:-.02em}
  .spot .of{font:600 10px/1.5 'IBM Plex Mono',monospace;color:#7c828f;margin-top:3px;letter-spacing:.06em}
  .says{font:500 11.5px/1.6 Manrope,sans-serif;color:#8d94a3;padding:2px 0 10px}
  .chip{display:inline-block;font:700 8.5px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;
    text-transform:uppercase;padding:4px 6px;border-radius:5px;background:#232838;color:#8d94a3;margin-left:6px}
  button{border:none;border-radius:12px;padding:18px 12px;cursor:pointer;width:100%;
    font:800 15px/1.2 Manrope,sans-serif;color:#fff;min-height:58px;margin-top:12px;background:#d8385a}
  button.ok{background:#1f6f45}
  button.ghost{background:#232838;color:#b9bfcc;min-height:44px;padding:12px;font-size:13px}
  button:disabled{opacity:.45;cursor:default}
  .says.rate{padding:0 0 8px 21px;color:#7c828f}
  .says.gap{padding:0 0 8px 21px;color:#e0a419}
  .says.gap.full,.says.gap.crowded{color:#5bd48b}
  .ask{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0 0 10px 21px}
  .ask .said{font:600 11.5px/1.5 Manrope,sans-serif;color:#5bd48b;flex:1;min-width:140px}
  .ask button{margin-top:0;width:auto;flex:1;min-width:180px}
  .ask button.yes{background:#1c2333;color:#b9bfcc;border:1px solid #2a3040;text-align:left}
  .note{font:500 11.5px/1.7 Manrope,sans-serif;color:#7c828f;margin-top:16px}
  .note b{color:#b9bfcc;font-weight:700}
  @keyframes flash{0%{transform:scale(.98)}40%{transform:scale(1.02)}100%{transform:scale(1)}}
  .state.pop{animation:flash .28s ease-out}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">khaali<span>.</span><small>last-mile demand &middot; simulated</small></div>
  <div id="state" class="state"><div class="word">Opening&hellip;</div></div>
  <div id="offers"></div>
  <div id="demand"></div>
  <div class="note" id="foot"></div>
</div>

<script>
/* Who this driver is, as far as khaali is concerned: an id this phone made up
   for itself, the same way the passenger app mints khaali-who. khaali holds no
   driver account, has not checked that anybody here drives anything, and has
   never seen a licence. The id is a handle so a ride you took stays yours - it
   is not an identity and it is not a verification. */
const ME = (() => {
  try {
    let v = localStorage.getItem('khaali-drive');
    if (!v) { v = 'd' + Math.random().toString(16).slice(2, 10) + Date.now().toString(16).slice(-4); localStorage.setItem('khaali-drive', v); }
    return v;
  } catch (e) { return 'd' + Math.random().toString(16).slice(2, 10); }
})();

const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h; return d.firstElementChild || d; };
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clock = (t) => new Date(t).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
const mins = (ms) => Math.max(0, Math.round(ms / 60000));

let spots = [], offers = [], windows = [], asks = [], gaps = [], head = null, busy = false, saidAt = 0, here = null;

/* Whether this driver has agreed to khaali using a rounded position while a
   window they said yes to is on. A separate answer from saying yes, kept on
   this phone, and off unless they turned it on. */
let sharing = (() => { try { return !!localStorage.getItem('khaali-drive-share'); } catch (e) { return false; } })();

function setState(cls, word, sub, quiet) {
  if (!quiet) saidAt = Date.now();
  const el = document.getElementById('state');
  el.className = 'state ' + cls + ' pop';
  el.innerHTML = '<div class="word">' + esc(word) + '</div>' + (sub ? '<div class="sub">' + sub + '</div>' : '');
  setTimeout(() => el.classList.remove('pop'), 300);
}

const tone = (w) => w === 'HIGH' ? '#5bd48b' : w === 'MEDIUM' ? '#e0a419' : '#f2a6b6';

function render() {
  /* The five-second poll must never wipe something this driver was just told.
     A ride lost to somebody else that flickers back into "Accept", or a
     confirmation that vanishes while they are still reading it, is worse than
     a page that says nothing. Same rule the conductor's page runs on. */
  const say = (Date.now() - saidAt > 6000) ? setState : (() => {});

  const mine = offers.filter(o => o.mine && o.status !== 'done');
  const open = offers.filter(o => o.status === 'offered');
  if (mine.length) {
    const o = mine[0];
    say('good', o.status === 'arrived' ? 'You are there' : 'Yours',
      esc(o.holder || 'A passenger') + ' &middot; ' + esc(o.from) + ' &rarr; ' + esc(o.to));
  } else if (open.length) {
    say('bad', open.length === 1 ? 'One ride waiting' : open.length + ' rides waiting',
      'First to accept gets it.');
  } else if (spots.length) {
    const s = spots[0];
    say('off', s.floor > 0 ? s.floor + '–' + s.ceiling + ' at ' + esc(s.at) : 'Nothing waiting yet',
      s.floor > 0 ? esc(s.windowText) + ' &middot; nobody has booked a ride yet' : 'Demand below, no ride asked for.');
  } else {
    say('off', 'Quiet', 'Nobody has booked a journey that ends off the network in the next hour and a half.');
  }

  // ---- the offers, which are people, not counts ----
  const ob = document.getElementById('offers');
  ob.innerHTML = '';
  for (const o of offers.slice(0, 6)) {
    const done = o.status === 'done' || o.status === 'cancelled';
    const c = $('<div class="card ' + (o.mine ? 'mine' : 'live') + '"></div>');
    c.appendChild($('<div class="lbl"><span>' +
      (o.mine ? (o.status === 'cancelled' ? 'Cancelled by the passenger'
        : o.status === 'done' ? 'Finished' : o.status === 'arrived' ? 'You are at the pickup' : 'Yours')
        : 'Ride waiting') +
      '</span><span>' + (o.status === 'offered' ? mins(o.msLeft) + ' min left' : esc(o.code)) + '</span></div>'));
    c.appendChild($('<div class="row"><div class="k">Passenger</div><div class="v">' + esc(o.holder || 'A passenger') + '</div></div>'));
    c.appendChild($('<div class="row"><div class="k">Pick up</div><div class="v">' + esc(o.from) + '</div></div>'));
    c.appendChild($('<div class="row"><div class="k">Drop</div><div class="v">' + esc(o.to) + '</div></div>'));
    c.appendChild($('<div class="row"><div class="k">Distance</div><div class="v">' + esc(o.km) + ' km' +
      (o.pax > 1 ? ' &middot; ' + o.pax + ' people' : '') + '</div></div>'));
    c.appendChild($('<div class="row"><div class="k">Fare</div><div class="v">&#8377;' + esc(o.fareMin) +
      '&ndash;&#8377;' + esc(o.fareMax) + '<span class="chip">bike to car</span></div></div>'));
    if (o.mine && o.status === 'accepted') {
      const b = $('<button class="ok">I am at the pickup</button>');
      b.onclick = () => act(o.id, 'arrived'); c.appendChild(b);
    } else if (o.mine && o.status === 'arrived') {
      const b = $('<button class="ok">Dropped them</button>');
      b.onclick = () => act(o.id, 'done'); c.appendChild(b);
    } else if (!done && o.status === 'offered') {
      const b = $('<button>Accept this ride</button>');
      b.disabled = busy;
      b.onclick = () => act(o.id, 'accept'); c.appendChild(b);
    }
    ob.appendChild(c);
  }

  // ---- the map: where demand is, not who is going ----
  const db = document.getElementById('demand');
  db.innerHTML = '';
  const card = $('<div class="card"></div>');
  card.appendChild($('<div class="lbl"><span>Where the buses stop</span><span>' +
    (head ? 'next 90 min' : '') + '</span></div>'));
  card.appendChild($('<div class="says">khaali is not assigning anyone. This is where demand is, not who is going.</div>'));
  if (!spots.length) {
    card.appendChild($('<div class="says">' + esc(head ? head.says : 'Loading…') + '</div>'));
  }
  for (const s of spots) {
    const sup = supplyFor(s);
    const row = $('<div class="spot">' +
      '<span class="dot" style="background:' + tone(s.size) + '"></span>' +
      '<div class="who"><div class="place">' + esc(s.at) +
        (s.seed ? '<span class="chip">demo</span>' : s.partSeed ? '<span class="chip">part demo</span>' : '') +
        '</div><div class="when">' + esc(s.windowText) +
        (s.away != null ? ' &middot; ' + esc(s.away) + ' km away' : '') +
        (sup.said ? ' &middot; ' + sup.said + ' said yes'
          + (sup.expected != null ? ', ' + sup.expected + ' expected' : '') : '') + '</div></div>' +
      '<div class="num"><div class="big">' + (s.floor > 0 ? esc(s.floor) + '–' + esc(s.ceiling) : esc(s.ceiling)) +
        '</div><div class="of">' + (s.floor > 0 ? 'no bus at all' : 'a bus exists') + '</div></div>' +
      '</div>');
    card.appendChild(row);

    /* Where the "expected" number came from, in full, every time it is shown.
       Never the ratio on its own: "31 of the last 50" can be checked against
       its denominator and "62%" cannot, and this page has no business showing
       a figure a driver has to take on trust. */
    if (sup.said && sup.rate) {
      card.appendChild($('<div class="says rate">' + esc(sup.rate.says) + '.' +
        (sup.rate.rate == null ? ''
          : ' <span class="chip">' + esc(sup.rate.quality) + '</span>' +
            (sup.rate.seed ? '<span class="chip">demo</span>'
              : sup.rate.partSeed ? '<span class="chip">part demo</span>' : '')) +
        '</div>'));
    }

    /* What khaali is short of here - or that it is not short at all, which is
       the sentence that stops this becoming a shout to the whole city. */
    const g = gapFor(s);
    if (g && (g.crowded || g.enough || g.asking > 0)) {
      card.appendChild($('<div class="says gap' + (g.crowded ? ' crowded' : g.enough ? ' full' : '') + '">' +
        esc(g.says) +
        (g.asking > 0 ? ' <span class="chip">asking ' + g.radiusKm + ' km out</span>' : '') +
        '</div>'));
    }

    /* The question, asked where the number is. A driver should not have to go
       looking for the place to answer it. */
    const ask = $('<div class="ask"></div>');
    if (sup.mine) {
      ask.appendChild($('<span class="said">You said yes to this one' +
        (sup.sharing ? ', and you are sharing roughly where you are' : '') + '.</span>'));
      const no = $('<button class="ghost">Change my mind</button>');
      no.onclick = () => unsay(sup.mineId);
      ask.appendChild(no);
    } else {
      const yes = $('<button class="ghost yes">Will you be around ' + esc(s.at) + ', ' + esc(s.windowText) + '?</button>');
      yes.disabled = busy;
      yes.onclick = () => sayYes(s);
      ask.appendChild(yes);
    }
    card.appendChild(ask);
  }
  db.appendChild(card);

  /* Sharing a position is a SECOND question, asked once and separately, and it
     costs nothing to refuse. That last clause is not a courtesy: a driver who
     shares nothing is recorded as "khaali could not see", never as a miss, so
     saying no genuinely does not count against anybody. */
  const shareBox = $('<div class="card"><div class="lbl"><span>Roughly where you are</span></div></div>');
  const on = myWindows().some(w => w.sharing);
  shareBox.appendChild($('<div class="says">' +
    'Only while a half hour you said yes to is on. khaali rounds it to about 100 metres, keeps only the ' +
    'latest one, uses it to say whether you are near the place and to sort this list, and deletes it when ' +
    'the window ends. It is never shown to a passenger, never written down, and saying no costs you ' +
    'nothing &mdash; you still count as having said yes.</div>'));
  const btn = $('<button class="ghost">' + (on ? 'Sharing &middot; tap to stop' : 'Share roughly where I am') + '</button>');
  btn.onclick = () => setSharing(!on);      // read at tap time, not at render time
  shareBox.appendChild(btn);
  if (myWindows().length) db.appendChild(shareBox);

  document.getElementById('foot').innerHTML =
    '<b>What this page is.</b> A stand-in for the screen a driver&rsquo;s own app would show. ' +
    'The counts are journeys people actually planned and booked in khaali, bucketed by the place the last ' +
    'stretch starts from and the half hour it starts in. The lower number is the people with no bus at all; ' +
    'the higher one adds the people who could take a slower bus and might not. Neither is a guess and neither ' +
    'is a percentage.<br><br>' +
    '<b>What khaali does not know.</b> Whether any of them turn up. It has never measured that, so it does ' +
    'not say. Places with fewer than ' + (head ? head.floor : 3) + ' people booked are not shown at all &mdash; ' +
    'that is not a hotspot, it is those people.<br><br>' +
    '<b>Saying yes.</b> It is a statement, not a booking. Nobody is holding you to it, khaali will not stop ' +
    'you taking a ride somewhere else, and there is no score attached to your name &mdash; khaali counts how ' +
    'often a yes turns out to be true by place and by time of day, never by person. You can take it back at ' +
    'any point before the half hour ends.<br><br>' +
    '<b>Why you are not told about everywhere.</b> khaali asks outward in rings &mdash; two kilometres, ' +
    'then five, then ten &mdash; and the ring widens only as far as the shortage justifies. It stops the ' +
    'moment as many drivers have said yes as there are people booked, and it says so when more have. ' +
    'Telling every driver in the city about a shortage of twelve is how a hundred of you end up sharing ' +
    'forty passengers, and the sixty who came for nothing are the ones who paid for it. The point is to ' +
    'close the gap, not to fill the place.<br><br>' +
    '<b>Where &ldquo;expected&rdquo; comes from.</b> khaali&rsquo;s own record of what happened at this place ' +
    'at this time of day, and it always shows you both counts rather than a percentage, so you can check the ' +
    'denominator instead of trusting the fraction. Under twenty it does not have a number and says so. The ' +
    'ones it could not see are drivers who shared no position and took no ride &mdash; they are left out of ' +
    'the sum entirely rather than counted as having failed to turn up.<br><br>' +
    '<b>What has not happened.</b> No driver has been dispatched to anybody. No fare has moved. khaali owns ' +
    'no vehicle, employs no driver, and has not checked that anyone reading this drives anything. Rows marked ' +
    'demo are seeded so the map is not blank; they are real questions asked of the real BMTC timetable, but ' +
    'nobody booked them.';
}

/* ---- the other side: saying you will be somewhere ---------------------- */

const myWindows = () => windows.filter(w => w.mine);
const supplyFor = (s) => windows.find(w => w.at === s.at && w.window === s.window)
  || { said: 0, mine: false, rungs: {} };
const gapFor = (s) => gaps.find(g => g.at === s.at && g.window === s.window) || null;

async function sayYes(spot) {
  if (busy) return; busy = true; render();
  try {
    const r = await fetch('/api/commit', { method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ driver: ME, at: spot.at, window: spot.window,
        share: sharing, lat: here ? here.lat : null, lng: here ? here.lng : null }) });
    const j = await r.json();
    busy = false; await pull();
    if (!j.ok) return setState('bad', j.reason === 'already-said' ? 'You already said yes' : 'No',
      j.error || 'khaali could not record that.');
    setState('good', 'Noted',
      'You said you expect to be around ' + esc(spot.at) + ', ' + esc(spot.windowText) +
      '. Nobody is holding you to it &mdash; you can still take a ride anywhere.');
  } catch (e) { busy = false; render(); setState('bad', 'No signal', 'Could not reach khaali.'); }
}

async function unsay(id) {
  if (busy) return; busy = true; render();
  try {
    await fetch('/api/commit/' + encodeURIComponent(id) + '?driver=' + encodeURIComponent(ME),
      { method: 'DELETE' });
    busy = false; await pull();
    setState('off', 'Taken back', 'khaali will not count you for that half hour.');
  } catch (e) { busy = false; render(); }
}

async function setSharing(on) {
  sharing = on;
  try { localStorage.setItem('khaali-drive-share', on ? '1' : ''); } catch (e) {}
  for (const w of myWindows()) {
    try {
      await fetch('/api/commit/' + encodeURIComponent(w.mineId), { method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ driver: ME, share: on }) });
    } catch (e) {}
  }
  if (on) await sendHere();
  await pull();
  setState(on ? 'good' : 'off', on ? 'Sharing' : 'Not sharing',
    on ? 'Rounded to about 100 metres, only while a window you said yes to is on.'
       : 'khaali has dropped it. You still count as having said yes.');
}

/** One rounded position, to each live commitment. Never a stream, never stored
    on this phone, and nothing at all if the driver has not said yes to it. */
async function sendHere() {
  if (!sharing || !here || !myWindows().length) return;
  for (const w of myWindows()) {
    try {
      await fetch('/api/commit/' + encodeURIComponent(w.mineId) + '/here', { method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ driver: ME, lat: here.lat, lng: here.lng }) });
    } catch (e) {}
  }
}

async function act(id, what) {
  if (busy) return; busy = true; render();
  try {
    const r = await fetch('/api/offers/' + encodeURIComponent(id) + '/' + what, { method: 'POST',
      headers: { 'content-type': 'application/json' }, body: JSON.stringify({ driver: ME }) });
    const j = await r.json();
    busy = false;
    if (j.offer) offers = offers.map(o => o.id === id ? j.offer : o);
    if (!j.ok) {
      render();
      setState('bad', j.reason === 'taken' ? 'Somebody else took it'
        : j.reason === 'expired' ? 'That one lapsed'
        : j.reason === 'already-holding' ? 'Finish your ride first'
        : 'No',
        j.reason === 'taken' ? 'It went to another driver a moment ago. Nothing you did wrong.'
        : j.reason === 'expired' ? 'Nobody took it in five minutes, so it is off the board.'
        : esc(j.error || j.reason));
      return;
    }
    render();
    setState('good', what === 'accept' ? 'It is yours' : what === 'arrived' ? 'Marked as there' : 'Done',
      what === 'accept' ? 'The passenger can see that somebody is coming.'
      : what === 'done' ? 'Nothing was charged. khaali moved no money for this.'
      : 'They know you are waiting.');
  } catch (e) {
    busy = false; render();
    setState('bad', 'No signal', 'Could not reach khaali. Try again in a moment.');
  }
}

async function pull() {
  if (busy) return;
  try {
    const near = here ? '?lat=' + here.lat + '&lng=' + here.lng : '';
    const [d, o, s] = await Promise.all([
      fetch('/api/demand' + near).then(r => r.json()),
      fetch('/api/offers?driver=' + encodeURIComponent(ME)).then(r => r.json()),
      fetch('/api/supply?driver=' + encodeURIComponent(ME) + (here ? '&lat=' + here.lat + '&lng=' + here.lng : ''))
        .then(r => r.json()),
    ]);
    head = d; spots = d.hotspots || []; offers = o.offers || [];
    windows = s.windows || []; asks = s.asks || []; gaps = s.gaps || [];
    render();
  } catch (e) { /* a poll that fails leaves the last true answer on screen */ }
}

// Where the driver is, if they say so. Used to sort the list by distance, and
// - only if they turned sharing on, and only for a window they said yes to -
// sent once per poll so khaali can say whether they are near the place. Four
// decimals here; the server rounds it to three before it stores anything.
try {
  navigator.geolocation && navigator.geolocation.getCurrentPosition(
    p => { here = { lat: +p.coords.latitude.toFixed(4), lng: +p.coords.longitude.toFixed(4) };
      pull().then(sendHere); },
    () => {}, { timeout: 6000, maximumAge: 300000 });
} catch (e) { /* no location, and the list is still ordered by time */ }

pull();
setInterval(() => { pull().then(sendHere); }, 5000);
</script>
</body>
</html>
